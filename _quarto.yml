  page-navigation: true
  bread-crumbs: false
  back-to-top-navigation: true
  search:
    show-item-context: true
    type: overlay
  navbar:
    title: Digital Humanities
    tools:
      - icon: github
        url: https://github.com/DHBern/dhbern.github.io/
    left:
      - text: Events
        href: /#events
      - text: Studies
        menu:
          - text: Studying DH in Bern
            href: teaching/index.qmd
          - text: How to apply
            href: teaching/application/index.qmd
          - text: Semester planner
            href: teaching/planning/index.qmd
          - text: Spring semester 2027
            href: teaching/fs2027/index.qmd
          - text: Autumn semester 2027
            href: teaching/hs2027/index.qmd
          - text: '---'
          - text: Introduction to Digital Humanities
            href: https://dhbern.github.io/introduction-to-dh/
          - text: DH Lab
            href: https://dhbern.github.io/dh-lab/
          - text: Lecture series
            href: https://dhbern.github.io/dh-lecture-series/
          - text: 'Lecture: Introduction to DH approaches (online)'
            href: content/intro-lecture/index.qmd
          - text: '---'
          - text: Study pages on dh.unibe.ch
            href: https://www.dh.unibe.ch/studium/index_ger.html
      - text: Research
        href: content/projects/index.qmd
      - text: Services
        href: content/services/index.qmd
      - text: About us
        href: https://www.dh.unibe.ch/about_us/team/index_eng.html
  page-footer:
    left: '[Digital Humanities, University of Bern](https://www.dh.unibe.ch/)'
    center: '[digitalhumanities@unibe.ch](mailto:digitalhumanities@unibe.ch) · [GitHub](https://github.com/DHBern) · [LinkedIn](https://www.linkedin.com/school/university-of-bern/)'
    right: '[News](/#blog) · [Events](/#events) · [Studies](/teaching/index.qmd) · [Projects](/content/projects/index.qmd) · [Services](/content/services/index.qmd)'

  sidebar:
    logo: ''
    style: 'docked'
    collapse-level: 1
    contents:
      - text: Projects
        href: content/projects/index.qmd
        contents: content/projects/*/index.qmd
      - text: Services
        href: content/services/index.qmd
        contents: content/services/*/index.qmd

format:
  html:
    toc: true
    toc-location: right
    theme:
      - brand
      - custom.scss
    code-copy: true
    code-overflow: wrap
    citations-hover: true
    crossrefs-hover: true
    css: styles.css
    link-external-icon: true
    link-external-newwindow: true
    # Internal = this repo's own pages: content/, teaching/, the asset folders and
    # root-level files. Everything else under dhbern.github.io/ is a separate
    # repo (dh-lab, introduction-to-dh, BeNASch, …) and counts as external (#133).
    # The *.app.github.dev alternative keeps relative links internal in a
    # Codespaces preview. No backslashes: the value ends up in a JS string.
    link-external-filter: '^https://(dhbern[.]github[.]io/((content|teaching|assets|site_libs|docs)([/?#]|$)|[^/?#]*[.][a-z0-9]+([?#]|$)|[?#]|$)|[^/]+[.]app[.]github[.]dev/)'
    include-in-header:
      - custom-header.html
    page-layout: full
    license: CC BY-SA 4.0

freeze: auto

editor: visual
